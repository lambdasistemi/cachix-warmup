name: Darwin GHC Cache

on:
  workflow_dispatch: {}

concurrency:
  group: darwin-ghc
  cancel-in-progress: true

jobs:
  warm-ghc:
    name: Warm GHC for aarch64-darwin
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            extra-substituters = https://paolino.cachix.org
            extra-trusted-public-keys = paolino.cachix.org-1:ecmgO3CXdgSWA2cHlm4srknd/cLFMLmK3i3NrzeDFaE=

      - name: Install cachix
        run: nix profile install nixpkgs#cachix

      - name: Build and push GHC
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          CACHIX_CACHE="paolino"

          # Targets: repo ref flake-attr [flake subdirectory]
          targets=(
            "lambdasistemi/singular main devShells.aarch64-darwin.default.ghc offchain"
            "lambdasistemi/agent-daemon main devShells.aarch64-darwin.default.ghc"
            "lambdasistemi/cardano-mpfs-offchain main devShells.aarch64-darwin.default.ghc"
            "lambdasistemi/amaru-treasury-tx main devShells.aarch64-darwin.default.ghc"
            "lambdasistemi/sideband main devShells.aarch64-darwin.default.ghc"
          )

          for entry in "${targets[@]}"; do
            read -r repo ref attr subdir <<< "$entry"
            echo "==> $repo${subdir:+/$subdir}#$attr (ref: $ref)"

            dir=$(mktemp -d)
            git clone --depth 1 --branch "$ref" "https://github.com/$repo.git" "$dir"

            echo "==> Building GHC"
            nix build -L "$dir${subdir:+/$subdir}#$attr" --no-link --print-out-paths > /tmp/ghc-out
            echo "==> Built: $(cat /tmp/ghc-out)"

            echo "==> Pushing to cachix"
            cachix push "$CACHIX_CACHE" < /tmp/ghc-out

            # The cache evicts least-recently-used paths, and consumers' CI
            # only substitutes, so an unpinned compiler disappears within
            # weeks. Pin it; each run replaces the previous revision.
            echo "==> Pinning the compiler"
            # macOS ships bash 3.2, which has no mapfile.
            compilers=()
            while IFS= read -r compiler; do
              compilers+=("$compiler")
            done < <(xargs nix-store -qR < /tmp/ghc-out \
              | grep -E '^/nix/store/[a-z0-9]{32}-ghc-[0-9]+(\.[0-9]+)+$')
            if [ "${#compilers[@]}" -eq 0 ]; then
              echo "::error::no GHC compiler in the closure of $(cat /tmp/ghc-out)"
              exit 1
            fi
            for compiler in "${compilers[@]}"; do
              pin="${repo##*/}-ghc-${compiler##*-}-aarch64-darwin"
              echo "==> pin $pin -> $compiler"
              cachix pin "$CACHIX_CACHE" "$pin" "$compiler" --keep-revisions 1
            done

            rm -rf "$dir"
            echo "==> Done with $repo"
          done
